<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#1e1e28"/>
  <!-- Body -->
  <rect x="16" y="76" width="68" height="22" fill="#4a4060" rx="4"/>
  <!-- Cardigan -->
  <rect x="22" y="76" width="56" height="22" fill="#5a5070"/>
  <!-- Neck -->
  <rect x="43" y="64" width="14" height="14" fill="#c09878" rx="2"/>
  <!-- Head - softer shape with slight jowl -->
  <ellipse cx="50" cy="52" rx="21" ry="22" fill="#c89870"/>
  <!-- Jowls subtle -->
  <ellipse cx="36" cy="65" rx="6" ry="4" fill="#b88860" opacity="0.6"/>
  <ellipse cx="64" cy="65" rx="6" ry="4" fill="#b88860" opacity="0.6"/>
  <!-- White/silver hair - short, permed look -->
  <path d="M29 42 Q28 34 32 28 Q42 22 50 22 Q58 22 68 28 Q72 34 71 42" fill="#ddd" stroke="#ddd"/>
  <path d="M29 42 Q31 36 50 34 Q69 36 71 42" fill="#eee"/>
  <!-- Soft white curls texture hint -->
  <path d="M33 36 Q38 32 44 35" stroke="#ccc" stroke-width="1.5" fill="none"/>
  <path d="M56 35 Q62 32 67 36" stroke="#ccc" stroke-width="1.5" fill="none"/>
  <path d="M30 42 Q35 39 40 41" stroke="#ddd" stroke-width="1.2" fill="none"/>
  <path d="M60 41 Q65 39 70 42" stroke="#ddd" stroke-width="1.2" fill="none"/>
  <!-- Ears - larger -->
  <ellipse cx="28" cy="53" rx="5" ry="6" fill="#c09878"/>
  <ellipse cx="72" cy="53" rx="5" ry="6" fill="#c09878"/>
  <!-- Clip-on earrings -->
  <circle cx="28" cy="58" r="2.5" fill="#c9a96e"/>
  <circle cx="72" cy="58" r="2.5" fill="#c9a96e"/>
  <!-- Many forehead wrinkles -->
  <path d="M36 41 Q50 39 64 41" stroke="#a07858" stroke-width="0.7" fill="none"/>
  <path d="M36 44 Q50 42 64 44" stroke="#a07858" stroke-width="0.65" fill="none"/>
  <path d="M37 47 Q50 45 63 47" stroke="#a07858" stroke-width="0.6" fill="none"/>
  <!-- Crow's feet -->
  <path d="M32 53 Q29 51 30 48" stroke="#a07858" stroke-width="0.8" fill="none"/>
  <path d="M33 55 Q29 54 28 51" stroke="#a07858" stroke-width="0.7" fill="none"/>
  <path d="M34 57 Q30 56 30 54" stroke="#a07858" stroke-width="0.6" fill="none"/>
  <path d="M68 53 Q71 51 70 48" stroke="#a07858" stroke-width="0.8" fill="none"/>
  <path d="M67 55 Q71 54 72 51" stroke="#a07858" stroke-width="0.7" fill="none"/>
  <path d="M66 57 Q70 56 70 54" stroke="#a07858" stroke-width="0.6" fill="none"/>
  <!-- Eyes - more hooded -->
  <ellipse cx="41" cy="52" rx="4" ry="3.5" fill="white"/>
  <ellipse cx="59" cy="52" rx="4" ry="3.5" fill="white"/>
  <!-- Hooded upper lid -->
  <path d="M37 50.5 Q41 48 45 50.5" fill="#c09878" stroke="none"/>
  <path d="M55 50.5 Q59 48 63 50.5" fill="#c09878" stroke="none"/>
  <circle cx="42" cy="53" r="2.2" fill="#5a3820"/>
  <circle cx="60" cy="53" r="2.2" fill="#5a3820"/>
  <circle cx="43" cy="52" r="0.7" fill="white"/>
  <circle cx="61" cy="52" r="0.7" fill="white"/>
  <!-- Eyebrows - grey, thinner with age -->
  <path d="M37 47 Q41 45.5 45 47" stroke="#aaa" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M55 47 Q59 45.5 63 47" stroke="#aaa" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Nose - prominent -->
  <path d="M46 58 Q50 64 54 58" stroke="#906848" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Deep nasolabial folds -->
  <path d="M37 62 Q39 67 40 70" stroke="#906848" stroke-width="1" fill="none"/>
  <path d="M63 62 Q61 67 60 70" stroke="#906848" stroke-width="1" fill="none"/>
  <!-- Lips - thinner -->
  <path d="M44 67 Q50 65 56 67" stroke="#906058" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M44 67 Q50 71 56 67" stroke="#906058" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Lip lines above -->
  <path d="M45 66 Q50 64.5 55 66" stroke="#906858" stroke-width="0.5" fill="none"/>
</svg>
